<div>
  <span class="inline-flex rounded-pill bg-primary-container px-4 py-2 text-label-md font-bold text-on-primary-container">Bienvenido de nuevo</span>
  <h1 class="mt-4 font-display text-display-sm text-on-surface lg:text-display-md">Entra a tu cocina</h1>
  <p class="mt-3 text-body-md font-medium leading-base text-on-surface-muted">Continúa descubriendo recetas, guardando ideas y compartiendo tus platos favoritos.</p>
</div>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="mt-8 grid gap-5">
  <label class="grid gap-2">
    <span class="text-body-sm font-bold text-on-surface">Correo electrónico</span>
    <input
      pInputText
      type="email"
      id="email"
      placeholder="tu@email.com"
      formControlName="email"
      class="h-12 w-full rounded-xl border border-outline bg-surface px-4 text-body-md font-medium text-on-surface outline-none placeholder:text-on-surface-muted transition-colors duration-fast ease-standard focus:bg-surface-container focus:shadow-[0_0_0_2px_rgb(var(--rgb-primary)/0.45)]"
      [ngClass]="{'ng-invalid ng-dirty': isInvalid('email')}"
    />
    @if (isInvalid('email')) {
      @if (loginForm.get('email')?.errors?.['required']) {
        <p-message severity="error" size="small" variant="simple">El email es obligatorio.</p-message>
      }
      @if (loginForm.get('email')?.errors?.['email']) {
        <p-message severity="error" size="small" variant="simple">Introduce un email válido.</p-message>
      }
    }
  </label>

  <label class="grid gap-2">
    <span class="text-body-sm font-bold text-on-surface">Contraseña</span>
    <p-password
      formControlName="password"
      [invalid]="isInvalid('password')"
      [toggleMask]="true"
      [feedback]="false"
      autocomplete="off"
      placeholder="Tu contraseña"
      fluid
    />
    @if (isInvalid('password')) {
      <p-message severity="error" size="small" variant="simple">La contraseña es obligatoria.</p-message>
    }
  </label>

  <button
    pButton
    type="submit"
    [disabled]="loginForm.invalid"
    class="mt-1 flex h-12 w-full items-center justify-center rounded-xl border-0 bg-primary text-title-md font-bold text-on-primary shadow-2 transition-all duration-fast ease-standard hover:shadow-3 active:scale-[0.99] disabled:opacity-60"
  >
    <span pButtonLabel>Entrar</span>
  </button>

  <div class="flex items-center gap-3">
    <hr class="flex-1 border-outline" />
    <span class="text-label-md font-bold text-on-surface-muted">O CONTINÚA CON</span>
    <hr class="flex-1 border-outline" />
  </div>

  <button
    type="button"
    class="flex h-12 items-center justify-center gap-3 rounded-xl border border-outline bg-surface text-body-md font-bold text-on-surface transition-colors duration-fast ease-standard hover:bg-surface-container"
    (click)="loginWithGoogle()"
  >
    <img src="assets/google.svg" alt="" class="size-5" />
    <span>Google</span>
  </button>

  <p class="text-center text-body-sm font-medium text-on-surface-muted">
    ¿No tienes cuenta?
    <button
      type="button"
      class="font-bold text-primary underline decoration-primary/40 underline-offset-4 hover:decoration-primary"
      (click)="toRegister(true)"
    >Regístrate</button>
  </p>
</form>
