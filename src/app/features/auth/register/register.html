<div>
  <span class="inline-flex rounded-pill bg-primary-container px-4 py-2 text-label-md font-bold text-on-primary-container">Nueva cuenta</span>
  <h1 class="mt-4 font-display text-display-sm text-on-surface lg:text-display-md">{{ registerTitle() }}</h1>
  <p class="mt-3 text-body-md font-medium leading-base text-on-surface-muted">Completa tu perfil y empieza a compartir lo que cocinas.</p>
</div>

<button
  type="button"
  class="mt-7 flex h-12 w-full items-center justify-center gap-3 rounded-xl border border-outline bg-surface text-body-md font-bold text-on-surface transition-colors duration-fast ease-standard hover:bg-surface-container"
  (click)="registerWithGoogle()"
>
  <img src="assets/google.svg" alt="" class="size-5" />
  <span>Registrarse con Google</span>
</button>

@if (submitError(); as err) {
  <div class="mt-5 rounded-xl border border-error/30 bg-error-container px-4 py-3 text-body-sm font-bold text-on-error-container">
    {{ err }}
  </div>
}

<form [formGroup]="registerForm" class="mt-7">
  <p-stepper
    [value]="activeStep()"
    (valueChange)="activeStep.set($event ?? 1)"
    class="basis-[40rem]"
  >
    <p-step-list>
      <p-step [value]="1" class="flex flex-row flex-auto gap-2">
        <ng-template #content let-activateCallback="activateCallback" let-value="value">
          <app-header-step1 [activeStep]="activeStep()" [value]="value" (onActiveCallBack)="activateCallback()" />
        </ng-template>
      </p-step>

      <p-step [value]="2" class="flex flex-row flex-auto gap-2">
        <ng-template #content let-value="value">
          <app-header-step2 [activeStep]="activeStep()" [value]="value" (onActiveCallBack)="activateSecondStep()" />
        </ng-template>
      </p-step>

      <p-step [value]="3" class="flex flex-row flex-auto gap-2">
        <ng-template #content let-value="value">
          <app-header-step3 [activeStep]="activeStep()" [value]="value" (onActiveCallBack)="activateThirdStep()" />
        </ng-template>
      </p-step>
    </p-step-list>

    <p-step-panels>
      <p-step-panel [value]="1">
        <ng-template #content>
          <app-body-step1 [registerForm]="registerForm" (submitEvent)="activateSecondStep()" />
        </ng-template>
      </p-step-panel>

      <p-step-panel [value]="2">
        <ng-template #content>
          <app-body-step2 [registerForm]="registerForm" (goBackEvent)="activeStep.set(1)" (submitEvent)="activateThirdStep()" />
        </ng-template>
      </p-step-panel>

      <p-step-panel [value]="3">
        <ng-template #content>
          <app-body-step3 [registerForm]="registerForm" (goBackEvent)="activeStep.set(2)" (submitEvent)="onSubmit()" />
        </ng-template>
      </p-step-panel>
    </p-step-panels>
  </p-stepper>
</form>

<p class="mt-5 text-center text-body-sm font-medium text-on-surface-muted">
  ¿Ya tienes cuenta?
  <button
    type="button"
    class="font-bold text-primary underline decoration-primary/40 underline-offset-4 hover:decoration-primary"
    (click)="toLogin()"
  >Inicia sesión</button>
</p>
