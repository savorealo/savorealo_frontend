<div [formGroup]="registerForm()" class="mx-auto grid w-full max-w-xl gap-5">
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="grid gap-1.5">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">{{ 'auth.email' | translate }}</span>
      <input
        pInputText
        formControlName="email"
        type="email"
        placeholder="tu@email.com"
        class="h-12 rounded-2xl border border-outline bg-surface px-4 text-sm font-semibold text-on-surface focus:outline-none focus:shadow-[0_0_0_2px_rgb(var(--rgb-primary)/0.35)]"
        [ngClass]="{'ng-invalid ng-dirty': isInvalid('email')}"
        fluid
      />
      <div class="min-h-5 text-[0.75rem]">
        @if (isInvalid('email')) {
          @if (registerForm().get('email')?.errors?.['required']) {
            <p-message severity="error" size="small" variant="simple" [text]="'auth.register.email_required' | translate" />
          } @else if (registerForm().get('email')?.errors?.['email']) {
            <p-message severity="error" size="small" variant="simple" [text]="'auth.register.email_invalid' | translate" />
          }
        }
      </div>
    </label>

    <label class="grid gap-1.5">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">{{ 'auth.register.username' | translate }}</span>
      <div class="relative">
        <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 font-mono text-base font-bold text-on-surface-muted leading-none">@</span>
        <input
          pInputText
          formControlName="username"
          type="text"
          autocapitalize="none"
          autocomplete="username"
          placeholder="cocinero"
          class="h-12 w-full rounded-2xl border border-outline bg-surface pl-11 pr-4 text-sm font-semibold text-on-surface focus:outline-none focus:shadow-[0_0_0_2px_rgb(var(--rgb-primary)/0.35)]"
          [ngClass]="{'ng-invalid ng-dirty': isInvalid('username')}"
          fluid
        />
      </div>
      <div class="min-h-5 text-[0.75rem]">
        @if (registerForm().get('username')?.pending) {
          <p-message severity="secondary" size="small" variant="simple" [text]="'auth.register.checking_username' | translate" />
        } @else if (isInvalid('username')) {
          @if (registerForm().get('username')?.errors?.['required']) {
            <p-message severity="error" size="small" variant="simple" [text]="'auth.register.username_required' | translate" />
          } @else if (registerForm().get('username')?.errors?.['usernameFormat']) {
            <p-message severity="error" size="small" variant="simple" [text]="registerForm().get('username')?.errors?.['usernameFormat']" />
          } @else if (registerForm().get('username')?.errors?.['usernameUnavailable']) {
            <p-message severity="error" size="small" variant="simple" [text]="registerForm().get('username')?.errors?.['usernameUnavailable']" />
          }
        }
      </div>
    </label>

    <label class="grid gap-1.5">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">{{ 'auth.password' | translate }}</span>
      <p-password
        formControlName="password"
        [placeholder]="'auth.register.password_minlength' | translate"
        [feedback]="true"
        [invalid]="isInvalid('password')"
        fluid
      />
      <div class="min-h-5 text-[0.75rem]">
        @if (isInvalid('password')) {
          @if (registerForm().get('password')?.errors?.['required']) {
            <p-message severity="error" size="small" variant="simple" [text]="'auth.register.password_required' | translate" />
          } @else if (registerForm().get('password')?.errors?.['minlength']) {
            <p-message severity="error" size="small" variant="simple" [text]="'auth.register.password_minlength' | translate" />
          } @else if (registerForm().get('password')?.errors?.['pattern']) {
            <p-message severity="error" size="small" variant="simple" [text]="'auth.register.password_pattern' | translate" />
          }
        }
      </div>
    </label>

    <label class="grid gap-1.5">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">{{ 'auth.register.confirm_password' | translate }}</span>
      <p-password
        formControlName="confirmPassword"
        [placeholder]="'auth.register.confirm_placeholder' | translate"
        [feedback]="false"
        [invalid]="isInvalid('confirmPassword') || registerForm().hasError('passwordMismatch')"
        fluid
      />
      <div class="min-h-5 text-[0.75rem]">
        @if (isInvalid('confirmPassword')) {
          <p-message severity="error" size="small" variant="simple" [text]="'auth.register.confirm_required' | translate" />
        } @else if (registerForm().hasError('passwordMismatch') && registerForm().get('confirmPassword')?.touched) {
          <p-message severity="error" size="small" variant="simple" [text]="'auth.register.password_mismatch' | translate" />
        }
      </div>
    </label>
  </div>
</div>

<div class="mx-auto mt-6 flex w-full max-w-xl justify-end">
  <button
    pButton
    type="button"
    (click)="onSubmit()"
    [label]="'auth.register.next' | translate"
    icon="pi pi-arrow-right"
    iconPos="right"
    class="h-12 rounded-2xl border-0 bg-primary px-6 text-sm font-black text-on-primary shadow-2 transition-transform duration-fast ease-standard hover:shadow-3 active:scale-[0.98]"
  ></button>
</div>
