<div [formGroup]="registerForm()" class="mx-auto grid w-full max-w-xl gap-5">
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="grid gap-2">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">Email</span>
      <input
        pInputText
        formControlName="email"
        type="email"
        placeholder="tu@email.com"
        class="h-12 rounded-2xl border border-outline bg-surface px-4 text-sm font-semibold text-on-surface"
        [ngClass]="{'ng-invalid ng-dirty': isInvalid('email')}"
        fluid
      />
      @if (isInvalid('email')) {
        @if (registerForm().get('email')?.errors?.['required']) {
          <p-message severity="error" size="small" variant="simple">El email es obligatorio.</p-message>
        } @else if (registerForm().get('email')?.errors?.['email']) {
          <p-message severity="error" size="small" variant="simple">Introduce un email valido.</p-message>
        }
      }
    </label>

    <label class="grid gap-2">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">Usuario</span>
      <div class="relative">
        <span class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm font-bold text-on-surface-muted">&#64;</span>
        <input
          pInputText
          formControlName="username"
          type="text"
          autocapitalize="none"
          autocomplete="username"
          placeholder="cocinero"
          class="h-12 w-full rounded-2xl border border-outline bg-surface pl-9 pr-4 text-sm font-semibold text-on-surface"
          [ngClass]="{'ng-invalid ng-dirty': isInvalid('username')}"
        />
      </div>
      @if (registerForm().get('username')?.pending) {
        <p-message severity="secondary" size="small" variant="simple">Comprobando disponibilidad…</p-message>
      } @else if (isInvalid('username')) {
        @if (registerForm().get('username')?.errors?.['required']) {
          <p-message severity="error" size="small" variant="simple">El usuario es obligatorio.</p-message>
        } @else if (registerForm().get('username')?.errors?.['usernameFormat']) {
          <p-message severity="error" size="small" variant="simple">{{ registerForm().get('username')?.errors?.['usernameFormat'] }}</p-message>
        } @else if (registerForm().get('username')?.errors?.['usernameUnavailable']) {
          <p-message severity="error" size="small" variant="simple">{{ registerForm().get('username')?.errors?.['usernameUnavailable'] }}</p-message>
        }
      }
    </label>

    <label class="grid gap-2">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">Contrasena</span>
      <p-password
        formControlName="password"
        placeholder="Minimo 8 caracteres"
        [feedback]="true"
        [invalid]="isInvalid('password')"
        fluid
      />
      @if (isInvalid('password')) {
        @if (registerForm().get('password')?.errors?.['required']) {
          <p-message severity="error" size="small" variant="simple">La contrasena es obligatoria.</p-message>
        } @else if (registerForm().get('password')?.errors?.['minlength']) {
          <p-message severity="error" size="small" variant="simple">Debe tener al menos 8 caracteres.</p-message>
        } @else if (registerForm().get('password')?.errors?.['pattern']) {
          <p-message severity="error" size="small" variant="simple">Incluye mayuscula, numero y simbolo.</p-message>
        }
      }
    </label>

    <label class="grid gap-2">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">Confirmar</span>
      <p-password
        formControlName="confirmPassword"
        placeholder="Repite tu contrasena"
        [feedback]="false"
        [invalid]="isInvalid('confirmPassword') || registerForm().hasError('passwordMismatch')"
        fluid
      />
      @if (isInvalid('confirmPassword')) {
        <p-message severity="error" size="small" variant="simple">Confirma tu contrasena.</p-message>
      } @else if (registerForm().hasError('passwordMismatch') && registerForm().get('confirmPassword')?.touched) {
        <p-message severity="error" size="small" variant="simple">Las contrasenas no coinciden.</p-message>
      }
    </label>
  </div>
</div>

<div class="mx-auto mt-6 flex w-full max-w-xl justify-end">
  <button
    pButton
    type="button"
    (click)="onSubmit()"
    label="Siguiente"
    icon="pi pi-arrow-right"
    iconPos="right"
    class="h-12 rounded-2xl border-0 bg-primary px-6 text-sm font-black text-on-primary shadow-2 transition-transform duration-fast ease-standard hover:shadow-3 active:scale-[0.98]"
  ></button>
</div>
