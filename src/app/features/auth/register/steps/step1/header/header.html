<button class="inline-flex border-0 bg-transparent" (click)="activateCallback()">
    <span
        class="inline-flex size-12 items-center justify-center rounded-pill border text-base transition-all duration-fast ease-standard"
        [ngClass]="{
            'border-primary bg-primary text-on-primary shadow-2': value <= activeStep,
            'border-outline bg-surface-container text-on-surface-muted': value > activeStep
        }"
    >
        <i class="pi pi-user"></i>
    </span>
</button>
