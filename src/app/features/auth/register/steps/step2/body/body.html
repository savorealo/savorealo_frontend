<div [formGroup]="registerForm()" class="mx-auto grid w-full max-w-xl gap-5">
  <div class="grid gap-4 sm:grid-cols-2">
    <label class="grid gap-1.5">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">Nombre completo</span>
      <input
        pInputText
        formControlName="fullName"
        type="text"
        placeholder="María García"
        class="h-12 rounded-2xl border border-outline bg-surface text-on-surface px-4 text-sm font-semibold focus:outline-none focus:shadow-[0_0_0_2px_rgb(var(--rgb-primary)/0.35)]"
        [ngClass]="{'ng-invalid ng-dirty': isInvalid('fullName')}"
        fluid
      />
      <div class="min-h-5 text-[0.75rem]">
        @if (isInvalid('fullName')) {
          <p-message severity="error" size="small" variant="simple">El nombre es obligatorio.</p-message>
        }
      </div>
    </label>

    <label class="grid gap-1.5">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">Fecha de nacimiento</span>
      <p-datepicker
        formControlName="birthDate"
        placeholder="Selecciona una fecha"
        [appendTo]="'body'"
        [maxDate]="today"
        [invalid]="isInvalid('birthDate')"
        fluid
      />
      <div class="min-h-5 text-[0.75rem]">
        @if (isInvalid('birthDate')) {
          <p-message severity="error" size="small" variant="simple">La fecha es obligatoria.</p-message>
        }
      </div>
    </label>

    <label class="grid gap-1.5 sm:col-span-2">
      <span class="text-xs font-black uppercase tracking-wide text-on-surface-muted">Bio</span>
      <textarea
        pTextarea
        formControlName="bio"
        placeholder="Cuéntanos qué te gusta cocinar..."
        rows="4"
        class="w-full resize-none rounded-2xl border border-outline bg-surface text-on-surface px-4 py-3 text-sm font-semibold focus:outline-none focus:shadow-[0_0_0_2px_rgb(var(--rgb-primary)/0.35)]"
      ></textarea>
      <div class="min-h-5"></div>
    </label>
  </div>
</div>

<div class="mx-auto mt-6 flex w-full max-w-xl items-center justify-between gap-3">
  <button
    pButton
    type="button"
    (click)="onGoBack()"
    label="Atrás"
    icon="pi pi-arrow-left"
    class="h-12 rounded-2xl border border-outline bg-surface px-5 text-sm font-black text-on-surface shadow-1 transition-all duration-fast ease-standard hover:bg-surface-container active:scale-[0.98]"
  ></button>
  <button
    pButton
    type="button"
    (click)="onSubmit()"
    label="Siguiente"
    icon="pi pi-arrow-right"
    iconPos="right"
    class="h-12 rounded-2xl border-0 bg-primary px-6 text-sm font-black text-on-primary shadow-2 transition-transform duration-fast ease-standard hover:shadow-3 active:scale-[0.98]"
  ></button>
</div>
