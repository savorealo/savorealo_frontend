<div class="flex h-[600px] w-[1000px] overflow-hidden rounded-2xl shadow-xl"
    [ngClass]="isLogin.value ? 'flex-row' : 'flex-row-reverse'">

    <!-- Logo-->
    <div class="relative flex w-1/2 flex-col p-8 text-center">
        <app-title/>
    </div>

    <!-- Lado derecho -->
    <div class="flex w-1/2 flex-col justify-center bg-white px-12 py-10">
        @if (isLogin.value) {
            <app-login/>
        }@else{
            <p>
                Registro
            </p>   
        }
    </div>
</div>
