<section class="rounded-[1.75rem] border border-black/5 bg-white p-5 shadow-[0_14px_40px_rgba(20,20,20,0.06)]">
	<div class="flex items-center justify-between gap-4">
		<div>
			<h2 class="text-xl font-black text-black">Colecciones</h2>
			<p class="mt-1 text-sm font-semibold text-black/45">Organiza recetas para volver a ellas rapido.</p>
		</div>
		<button type="button" class="hidden rounded-full bg-orange-50 px-4 py-2 text-sm font-black text-orange-600 transition hover:bg-orange-100 sm:inline-flex">
			Nueva coleccion
		</button>
	</div>

	<div class="mt-5 grid gap-4 md:grid-cols-3">
		@for (collection of collections(); track collection.id) {
			<button
				type="button"
				class="group overflow-hidden rounded-3xl border border-black/5 bg-[#fafafa] text-left transition hover:-translate-y-0.5 hover:shadow-xl"
				(click)="selectCollection.emit(collection.id)"
			>
				<div class="grid h-28 grid-cols-3 gap-1 overflow-hidden">
					@for (imageUrl of collection.imageUrls; track imageUrl) {
						<img [src]="imageUrl" [alt]="collection.title" class="size-full object-cover transition duration-500 group-hover:scale-105" />
					}
				</div>
				<div class="p-4">
					<span class="inline-flex rounded-full px-3 py-1 text-xs font-black text-white" [class]="collection.accent">{{ collection.count }} guardadas</span>
					<h3 class="mt-3 text-base font-black text-black">{{ collection.title }}</h3>
					<p class="mt-1 line-clamp-2 text-sm font-semibold leading-5 text-black/45">{{ collection.description }}</p>
				</div>
			</button>
		}
	</div>
</section>
