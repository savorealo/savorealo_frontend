<article class="group relative min-h-[280px] overflow-hidden rounded-2xl border border-outline bg-surface-container shadow-2 transition-all duration-fast ease-standard hover:-translate-y-0.5 hover:shadow-3">
	<img
		[ngSrc]="imageUrl()"
		[alt]="title()"
		fill
		sizes="(max-width: 768px) 100vw, 33vw"
		class="object-cover transition-transform duration-slow ease-decelerated group-hover:scale-105"
	/>
	<div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/30 to-transparent"></div>

	<a
		[routerLink]="['/post', post().id]"
		class="absolute inset-0 z-[1]"
		[attr.aria-label]="title()"
	></a>

	@if (isVideo()) {
		<div class="absolute left-4 top-4 grid size-11 place-items-center rounded-pill bg-black/60 text-white backdrop-blur">
			<i class="pi pi-play"></i>
		</div>
		<span class="absolute right-4 top-4 rounded-pill bg-black/70 px-2 py-1 text-label-md font-bold text-white">1:25</span>
	} @else {
		<button
			type="button"
			class="absolute right-4 top-4 z-[2] grid size-11 place-items-center rounded-pill bg-black/45 text-white backdrop-blur transition-all duration-fast ease-standard hover:bg-primary hover:text-on-primary active:scale-[0.98]"
			[class.text-primary]="post().saved"
			(click)="save.emit(post())"
			aria-label="Guardar receta"
		>
			<i [class]="post().saved ? 'pi pi-bookmark-fill' : 'pi pi-bookmark'"></i>
		</button>
	}

	<div class="absolute inset-x-0 bottom-0 grid gap-3 p-4">
		<div class="flex items-center justify-between gap-3">
			<div class="flex min-w-0 items-center gap-2">
				<img
					[src]="post().author.photoUrl || '/assets/icons/new_logo.png'"
					alt=""
					class="size-7 rounded-pill border border-white/25 object-cover"
				/>
				<span class="truncate text-label-md font-bold text-white">{{ authorName() }}</span>
				<i class="pi pi-check-circle text-[0.7rem] text-tertiary"></i>
			</div>
			<span class="rounded-pill bg-black/70 px-3 py-1 text-label-md font-bold text-white">{{ minutes() }} min</span>
		</div>

		<h2 class="line-clamp-3 text-body-lg font-bold leading-tight text-white">{{ title() }}</h2>

		<footer class="flex items-center gap-4 text-label-md font-bold text-white/90">
			<span class="inline-flex items-center gap-1"><i class="pi pi-heart-fill text-error"></i>{{ post().likesCount }}</span>
			<span class="inline-flex items-center gap-1"><i class="pi pi-comment"></i>{{ post().commentsCount }}</span>
			<span class="ml-auto rounded-pill bg-white/15 px-3 py-1 text-primary">#{{ tag() }}</span>
		</footer>
	</div>
</article>
