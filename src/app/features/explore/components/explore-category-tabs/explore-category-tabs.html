<nav class="flex gap-2 overflow-x-auto py-3" aria-label="Categorias de recetas">
	@for (tab of tabs; track tab.label) {
		<button
			type="button"
			class="inline-flex h-11 shrink-0 items-center gap-2 rounded-pill border border-outline px-4 text-body-sm font-bold transition-colors duration-fast ease-standard"
			[class]="selected() === tab.value ? 'bg-primary text-on-primary border-primary' : 'bg-surface-container text-on-surface-muted hover:bg-surface-container-high hover:text-on-surface'"
			(click)="categoryChange.emit(tab.value)"
		>
			<i [class]="tab.icon"></i>
			<span>{{ tab.label }}</span>
		</button>
	}
	<button type="button" class="grid size-11 shrink-0 place-items-center rounded-pill bg-surface-container text-on-surface-muted hover:bg-surface-container-high">
		<i class="pi pi-chevron-right"></i>
	</button>
</nav>
