<header class="sticky top-0 z-30 bg-[#070707]/90 px-5 py-5 backdrop-blur-xl">
	<div class="mx-auto grid max-w-[1280px] grid-cols-[minmax(0,1fr)_auto] items-center gap-5 xl:grid-cols-[minmax(20rem,44rem)_auto]">
		<label class="relative min-w-0">
			<i class="pi pi-search absolute left-5 top-1/2 -translate-y-1/2 text-lg text-white/55"></i>
			<input
				type="search"
				(input)="onSearch($event)"
				class="h-12 w-full rounded-full border border-white/5 bg-white/[0.08] pl-14 pr-16 text-sm font-medium text-white outline-none placeholder:text-white/55 focus:border-orange-400/40 focus:bg-white/[0.12]"
				placeholder="Buscar recetas, ingredientes o usuarios..."
			/>
			<span class="absolute right-5 top-1/2 hidden -translate-y-1/2 rounded-md bg-white/5 px-2 py-1 text-xs font-semibold text-white/60 sm:inline">⌘ K</span>
		</label>

		<div class="flex items-center gap-3">
			<button
				type="button"
				class="inline-flex h-12 items-center gap-2 rounded-full bg-gradient-to-r from-orange-500 to-orange-600 px-6 text-base font-black text-white shadow-[0_12px_36px_rgba(255,101,32,0.35)] transition hover:brightness-110"
				(click)="create.emit()"
			>
				<i class="pi pi-plus"></i>
				<span class="hidden sm:inline">Crear</span>
			</button>

			<button type="button" class="hidden h-12 items-center gap-2 rounded-full border border-white/10 px-5 text-sm font-black text-white transition hover:bg-white/10 md:inline-flex">
				<span>✨</span>
				<span>IA</span>
			</button>

			<button type="button" class="relative hidden size-12 place-items-center rounded-full border border-white/10 text-white transition hover:bg-white/10 sm:grid" aria-label="Notificaciones">
				<i class="pi pi-bell text-xl"></i>
				<span class="absolute right-1 top-1 grid size-5 place-items-center rounded-full bg-orange-600 text-[0.7rem] font-black">3</span>
			</button>

			<a routerLink="/profile" class="flex items-center gap-2 rounded-full focus:outline-none focus:ring-2 focus:ring-orange-400">
				<span class="grid size-12 overflow-hidden rounded-full bg-orange-500">
					<img
						[src]="profile()?.photo_url || logoUrl"
						[alt]="profile()?.username || 'Perfil'"
						class="size-full"
						[class.object-cover]="profile()?.photo_url"
						[class.object-contain]="!profile()?.photo_url"
					/>
				</span>
				<i class="pi pi-chevron-down hidden text-sm text-white/75 sm:inline"></i>
			</a>
		</div>
	</div>
</header>
