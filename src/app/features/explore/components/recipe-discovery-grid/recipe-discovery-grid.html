<section class="grid gap-5">
	@if (error()) {
		<div class="flex items-center gap-3 rounded-2xl border border-red-500/20 bg-red-500/10 p-4 text-sm font-semibold text-red-100">
			<i class="pi pi-exclamation-triangle"></i>
			<span class="flex-1">{{ error() }}</span>
			<button type="button" class="font-black text-white" (click)="retry.emit()">Reintentar</button>
		</div>
	}

	@if (loading() && posts().length === 0) {
		<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
			@for (item of [1, 2, 3, 4, 5, 6]; track item) {
				<div class="h-[250px] animate-pulse rounded-2xl bg-white/10"></div>
			}
		</div>
	} @else if (isEmpty()) {
		<div class="grid min-h-60 place-items-center rounded-2xl border border-white/10 bg-white/[0.04] text-center text-white/70">
			<div>
				<i class="pi pi-search text-3xl"></i>
				<p class="mt-3 font-bold">No hay recetas para esta categoria.</p>
			</div>
		</div>
	} @else {
		<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
			@for (post of posts(); track post.id) {
				<app-recipe-discovery-card [post]="post" (save)="save.emit($event)" />
			}
		</div>
	}

	@if (loadingMore()) {
		<div class="h-14 animate-pulse rounded-2xl bg-white/10"></div>
	}

	@if (!loading() && !isEmpty()) {
		<button
			type="button"
			class="inline-flex h-14 items-center justify-center gap-3 rounded-2xl border border-white/10 bg-white/[0.04] text-base font-bold text-white transition hover:bg-white/10"
			[disabled]="loadingMore()"
			(click)="loadMore.emit()"
		>
			<i class="pi pi-chevron-down text-sm"></i>
			<span>{{ loadingMore() ? 'Cargando...' : 'Cargar mas recetas' }}</span>
		</button>
	}
</section>
