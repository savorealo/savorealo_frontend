<section class="relative overflow-hidden rounded-2xl border border-outline bg-surface-container px-6 py-6">
	<div class="relative z-10 max-w-[36rem]">
		<h1 class="font-display text-display-sm text-on-surface lg:text-display-md">{{ 'explore.title' | translate }}</h1>
		<p class="mt-3 text-body-lg font-medium text-on-surface-muted">
			{{ 'explore.subtitle' | translate }}
		</p>
	</div>

	<div class="pointer-events-none absolute right-0 top-0 hidden h-full w-[28rem] items-center justify-end lg:flex">
		<div class="absolute right-10 size-40 rounded-pill bg-primary/30 blur-3xl"></div>
		<img
			[src]="animationUrl"
			alt=""
			class="relative h-36 object-contain object-right"
		/>
	</div>
</section>
