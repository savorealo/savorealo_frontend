<section class="relative overflow-hidden rounded-[2rem] px-2 py-4">
	<div class="relative z-10">
		<h1 class="text-4xl font-black tracking-tight text-white lg:text-5xl">Explorar</h1>
		<p class="mt-2 text-lg font-medium text-white/85">
			Descubre recetas increibles de <span class="font-black text-orange-500">nuestra comunidad</span>
		</p>
	</div>

	<div class="pointer-events-none absolute right-0 top-0 hidden h-44 w-[30rem] items-center justify-end lg:flex">
		<div class="absolute right-10 size-52 rounded-full bg-orange-500/25 blur-3xl"></div>
		<img
			[src]="animationUrl"
			alt=""
			class="relative h-full w-full object-contain object-right drop-shadow-[0_0_36px_rgba(255,112,32,0.55)]"
		/>
	</div>
</section>
