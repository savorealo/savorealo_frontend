<app-shell>
	<div class="grid h-full grid-rows-[auto_minmax(0,1fr)] overflow-hidden bg-surface text-on-surface">
		<app-feed-topbar (create)="composerOpen.set(!composerOpen())" />

		<section class="mx-auto grid min-h-0 w-full max-w-[1100px] grid-cols-1 grid-rows-[minmax(0,1fr)] gap-8 px-0 sm:px-4 lg:grid-cols-[minmax(0,560px)_300px] xl:gap-10">
			<main class="flex h-full min-h-0 flex-col">
				<app-stories-strip />

				@if (composerOpen()) {
					<div class="max-h-[70vh] overflow-y-auto pb-4">
						<app-create-post (postCreated)="addCreatedPost($event)" />
					</div>
				}

				<app-feed-post-list
					class="min-h-0 flex-1"
					[posts]="feed.posts()"
					[loading]="feed.loading()"
					[loadingMore]="feed.loadingMore()"
					[isEmpty]="feed.isEmpty()"
					[error]="feed.error()"
					(like)="feed.toggleLike($event)"
					(save)="feed.toggleSave($event)"
					(comment)="openComments($event)"
					(report)="openReport($event)"
					(retry)="feed.loadHomeFeed()"
					(nearEnd)="feed.loadMore()"
				/>
			</main>

			<div class="hidden min-w-0 py-4 lg:block">
				<app-feed-right-rail />
			</div>
		</section>
	</div>

	<app-comments-sheet [(visible)]="commentsOpen" [post]="selectedPost()" />

	@if (reportingPost(); as p) {
		<app-report-sheet [post]="p" (close)="closeReport()" />
	}
</app-shell>

<app-story-viewer />
