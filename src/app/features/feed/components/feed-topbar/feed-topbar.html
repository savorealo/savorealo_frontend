<header class="sticky top-0 z-30 border-b border-outline bg-surface/90 px-3 py-2.5 backdrop-blur sm:px-4 sm:py-3">
	<div class="mx-auto grid max-w-[1100px] grid-cols-[1fr_auto_auto] items-center gap-2 sm:gap-3">
		<!-- Search trigger — opens global panel -->
		<button
			type="button"
			class="relative flex h-11 min-w-0 items-center gap-3 rounded-pill border border-outline bg-surface-container pl-11 pr-3 text-body-sm font-semibold text-on-surface-muted transition-colors duration-fast ease-standard hover:bg-surface-container-high hover:text-on-surface focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:pl-12 sm:pr-4"
			(click)="globalSearch.openPanel()"
			aria-label="Buscar"
		>
			<i class="pi pi-search absolute left-4 top-1/2 -translate-y-1/2 text-base sm:text-lg"></i>
			<span class="truncate sm:hidden">Buscar...</span>
			<span class="hidden truncate sm:inline">Buscar recetas, ingredientes o usuarios...</span>
			<kbd class="ml-auto hidden rounded-sm border border-outline bg-surface px-1.5 py-0.5 text-[0.65rem] font-bold text-on-surface-muted sm:block">⌘K</kbd>
		</button>

		<button
			type="button"
			class="inline-grid size-11 place-items-center rounded-pill bg-primary text-body-sm font-bold text-on-primary shadow-1 transition-all duration-fast ease-standard hover:shadow-2 active:scale-95 sm:inline-flex sm:w-auto sm:gap-2 sm:px-5"
			(click)="create.emit()"
			aria-label="Crear publicación"
		>
			<i class="pi pi-plus text-sm"></i>
			<span class="hidden sm:inline">Crear</span>
		</button>

		<div class="flex items-center gap-2">
			<a
				routerLink="/notifications"
				class="relative grid size-11 place-items-center rounded-pill text-on-surface transition-colors duration-fast ease-standard hover:bg-surface-container"
				aria-label="Notificaciones"
			>
				<i class="pi pi-bell text-xl"></i>
				@if (notifications.unreadCount() > 0) {
					<span class="absolute right-1 top-1 grid min-w-[16px] h-[16px] place-items-center rounded-pill bg-error px-1 text-[0.6rem] font-black text-on-error">
						{{ notifications.unreadCount() > 9 ? '9+' : notifications.unreadCount() }}
					</span>
				}
			</a>

			<a routerLink="/profile" class="hidden items-center gap-2 rounded-pill focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:flex">
				<span class="grid size-10 shrink-0 place-items-center overflow-hidden rounded-pill bg-primary">
					<img
						[src]="profile()?.photo_url || logoUrl"
						[alt]="profile()?.username || 'Perfil'"
						class="size-full"
						[class.object-cover]="profile()?.photo_url"
						[class.object-contain]="!profile()?.photo_url"
					/>
				</span>
				<i class="pi pi-chevron-down hidden text-sm text-on-surface-muted sm:inline"></i>
			</a>
		</div>
	</div>
</header>
