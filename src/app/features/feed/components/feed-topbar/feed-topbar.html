<header class="sticky top-0 z-30 border-b border-black/10 bg-white/95 px-4 py-4 backdrop-blur">
	<div class="mx-auto grid max-w-[1040px] grid-cols-[1fr_auto_auto] items-center gap-4">
		<!-- Search trigger — opens global panel -->
		<button
			type="button"
			class="relative flex h-11 w-full items-center gap-3 rounded-full border-0 bg-[#f1f1f1] pl-14 pr-4 text-sm font-semibold text-black/30 transition hover:bg-[#e8e8e8] focus:outline-none focus:shadow-[0_0_0_2px_rgba(255,139,37,0.22)]"
			(click)="globalSearch.openPanel()"
			aria-label="Buscar"
		>
			<i class="pi pi-search absolute left-5 top-1/2 -translate-y-1/2 text-xl text-black/25"></i>
			<span>Buscar recetas, ingredientes o usuarios...</span>
			<kbd class="ml-auto hidden rounded-md border border-black/10 bg-black/5 px-1.5 py-0.5 text-[0.65rem] font-bold text-black/25 sm:block">⌘K</kbd>
		</button>

		<button
			type="button"
			class="inline-flex h-11 items-center gap-2 rounded-full bg-[#ff8f27] px-5 text-base font-black text-white shadow-sm transition hover:bg-[#f47f13]"
			(click)="create.emit()"
		>
			<i class="pi pi-plus text-sm"></i>
			<span class="hidden sm:inline">Crear</span>
		</button>

		<div class="flex items-center gap-3">
			<a
				routerLink="/notifications"
				class="relative hidden size-10 place-items-center rounded-full text-black transition hover:bg-black/5 sm:grid"
				aria-label="Notificaciones"
			>
				<i class="pi pi-bell text-2xl"></i>
				@if (notifications.unreadCount() > 0) {
					<span class="absolute right-1 top-1 flex size-4 items-center justify-center rounded-full bg-[#ff6d00] text-[0.6rem] font-black text-white">
						{{ notifications.unreadCount() > 9 ? '9+' : notifications.unreadCount() }}
					</span>
				}
			</a>

			<a routerLink="/profile" class="flex items-center gap-2 rounded-full focus:outline-none focus:ring-2 focus:ring-orange-400">
				<span class="grid size-11 shrink-0 place-items-center overflow-hidden rounded-full border border-[#ff8f27] bg-[#ff8f27]">
					<img
						[src]="profile()?.photo_url || logoUrl"
						[alt]="profile()?.username || 'Perfil'"
						class="size-full"
						[class.object-cover]="profile()?.photo_url"
						[class.object-contain]="!profile()?.photo_url"
					/>
				</span>
				<i class="pi pi-chevron-down hidden text-sm text-black/35 sm:inline"></i>
			</a>
		</div>
	</div>
</header>
