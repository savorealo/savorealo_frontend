<section>
	<h2 class="mb-2 text-sm font-black text-black">Receta del dia</h2>
	<article class="relative aspect-[1.45] overflow-hidden rounded-2xl bg-black shadow-sm">
		<img [src]="imageUrl" alt="Pancakes de avena" class="h-full w-full object-cover" />
		<div class="absolute bottom-3 left-3 w-[62%] rounded-2xl bg-white/70 p-3 shadow-lg backdrop-blur-md">
			<h3 class="text-xs font-black leading-tight text-black">Pancakes de avena</h3>
			<p class="mt-1 text-[0.62rem] font-semibold leading-tight text-black/55">y platanos rojos</p>
			<button type="button" class="mt-2 rounded-full bg-[#ff8f27] px-4 py-1.5 text-xs font-black text-white">
				Ver receta
			</button>
		</div>
	</article>
</section>
