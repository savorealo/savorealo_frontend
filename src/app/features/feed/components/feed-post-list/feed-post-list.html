<cdk-virtual-scroll-viewport
	itemSize="540"
	class="h-full w-full"
	(scrolledIndexChange)="onScrolledIndexChange()"
>
	<div class="grid gap-7 pb-10">
		@if (error()) {
			<div class="mx-auto grid w-full max-w-[500px] place-items-center rounded-2xl border border-error/30 bg-error-container p-8 text-center text-on-error-container">
				<div>
					<i class="pi pi-exclamation-triangle text-3xl"></i>
					<p class="mt-3 text-body-md font-bold">{{ error() }}</p>
					<button
						type="button"
						class="mt-4 inline-flex h-11 items-center gap-2 rounded-pill bg-on-error-container px-5 text-body-sm font-bold text-error-container transition-transform duration-fast ease-standard hover:shadow-3 active:scale-[0.98]"
						(click)="retry.emit()"
					>
						<i class="pi pi-refresh text-xs"></i>
						Reintentar
					</button>
				</div>
			</div>
		} @else if (loading() && posts().length === 0) {
			@for (i of [1, 2, 3]; track i) {
				<app-skeleton-card />
			}
		} @else if (isEmpty()) {
			<div class="mx-auto w-full max-w-[500px] rounded-2xl border border-outline bg-surface-container">
				<app-emptystate
					icon="pi pi-home"
					title="Tu feed está vacío"
					description="Sigue a otros cocineros para ver sus recetas"
				/>
			</div>
		}

		<app-post-card
			*cdkVirtualFor="let post of posts(); trackBy: trackById"
			[post]="post"
			(onLike)="like.emit($event)"
			(onSave)="save.emit($event)"
			(onComment)="comment.emit($event)"
			(onReport)="report.emit($event)"
		/>

		@if (loadingMore()) {
			<app-skeleton-card />
		}
	</div>
</cdk-virtual-scroll-viewport>
