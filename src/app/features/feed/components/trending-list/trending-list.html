<section class="rounded-2xl border border-outline bg-surface-container p-5 shadow-1">
	<header class="mb-3 flex items-center justify-between">
		<h2 class="text-title-sm font-bold text-on-surface">Tendencias</h2>
		<a routerLink="/explore" class="text-label-md font-bold text-primary hover:underline">Ver todo</a>
	</header>

	@if (loading()) {
		<div class="grid gap-3">
			@for (_ of [1,2,3]; track $index) {
				<div class="flex items-center gap-2">
					<div class="size-11 shrink-0 rounded-xl bg-surface-container-low animate-pulse"></div>
					<div class="w-5 text-center">
						<div class="h-3 w-4 rounded bg-surface-container-low animate-pulse"></div>
					</div>
					<div class="flex-1 space-y-1.5">
						<div class="h-3 w-28 rounded bg-surface-container-low animate-pulse"></div>
						<div class="h-2.5 w-20 rounded bg-surface-container-low animate-pulse"></div>
					</div>
				</div>
			}
		</div>
	} @else if (trends().length === 0) {
		<p class="text-body-sm text-on-surface-muted">Sin tendencias disponibles.</p>
	} @else {
		<div class="grid gap-3">
			@for (trend of trends(); track trend.id) {
				<a [routerLink]="['/posts', trend.postId]" class="grid grid-cols-[44px_18px_1fr] items-center gap-2 rounded-xl transition-colors duration-fast ease-standard hover:bg-surface-container-low">
					@if (trend.imageUrl) {
						<img [src]="trend.imageUrl" alt="" class="size-11 rounded-xl object-cover" />
					} @else {
						<div class="size-11 rounded-xl bg-primary-container grid place-items-center">
							<i class="pi pi-fork-knife text-primary text-base"></i>
						</div>
					}
					<span class="text-body-sm font-bold text-on-surface-muted text-center">{{ trend.id }}</span>
					<div class="min-w-0 leading-tight">
						<strong class="block truncate text-body-sm font-bold text-on-surface">{{ trend.title }}</strong>
						<span class="text-label-md font-semibold text-on-surface-muted">{{ trend.posts }}</span>
					</div>
				</a>
			}
		</div>
	}
</section>
