<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [dismissableMask]="true"
  [style]="{ width: 'min(95vw, 480px)' }"
  [showHeader]="false"
  appendTo="body"
 >
  <div class="grid gap-0">

    <!-- Header -->
    <div class="flex items-center justify-between gap-3 border-b border-outline px-5 pb-4 pt-5">
      <h2 class="text-title-md font-bold text-on-surface">{{ 'places.add_review' | translate }}</h2>
      <button
        type="button"
        class="grid size-9 place-items-center rounded-xl text-on-surface-muted transition-colors hover:bg-surface-container"
        (click)="visible.set(false)"
        [attr.aria-label]="'report.close' | translate"
      >
        <i class="pi pi-times text-sm"></i>
      </button>
    </div>

    <div class="grid gap-5 px-5 py-5">

      <!-- Estrellas interactivas -->
      <div>
        <p class="mb-2 text-label-md font-bold uppercase tracking-wide text-on-surface-muted">{{ 'places.review.your_rating' | translate }}</p>
        <div class="flex gap-2"
          (mouseleave)="hovered.set(0)"
        >
          @for (n of stars; track n) {
            <button
              type="button"
              class="text-3xl transition-transform duration-fast hover:scale-110 active:scale-95"
              (mouseenter)="hovered.set(n)"
              (click)="rating.set(n)"
              [attr.aria-label]="n"
            >
              <i
                [class]="starActive(n) ? 'pi pi-star-fill text-primary' : 'pi pi-star text-outline-strong'"
              ></i>
            </button>
          }
        </div>
        @if (rating() > 0) {
          <p class="mt-1 text-label-md font-semibold text-on-surface-muted">
            {{ ('places.review.rating.' + rating()) | translate }}
          </p>
        }
      </div>

      <!-- Comentario -->
      <label class="grid gap-1.5">
        <span class="text-label-md font-bold uppercase tracking-wide text-on-surface-muted">{{ 'places.review.comment' | translate }} <span class="normal-case font-normal">{{ 'places.review.optional' | translate }}</span></span>
        <textarea
          [ngModel]="comment()"
          (ngModelChange)="comment.set($event)"
          rows="4"
          maxlength="500"
          [placeholder]="'places.review.placeholder' | translate"
          class="resize-none rounded-xl border border-outline bg-surface px-4 py-3 text-body-sm font-medium text-on-surface outline-none transition-colors focus:border-primary"
        ></textarea>
        <span class="text-right text-label-md text-on-surface-muted">{{ comment().length }}/500</span>
      </label>

      <!-- Error -->
      @if (error()) {
        <p class="rounded-xl bg-error-container px-4 py-3 text-body-sm font-semibold text-on-error-container">
          {{ error() | translate }}
        </p>
      }

    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 border-t border-outline px-5 py-4">
      <button
        type="button"
        class="inline-flex min-h-10 items-center gap-2 rounded-pill border border-outline px-4 text-body-sm font-bold text-on-surface transition-colors hover:bg-surface-container"
        (click)="visible.set(false)"
      >
        {{ 'places.review.cancel' | translate }}
      </button>
      <button
        type="button"
        class="inline-flex min-h-10 items-center gap-2 rounded-pill bg-primary px-5 text-body-sm font-bold text-on-primary transition-all hover:shadow-2 active:scale-[0.98] disabled:opacity-50"
        [disabled]="saving() || rating() === 0"
        (click)="submit()"
      >
        @if (saving()) {
          <i class="pi pi-spinner pi-spin text-xs"></i>
        }
        {{ 'places.review.submit' | translate }}
      </button>
    </div>

  </div>
</p-dialog>
