<header class="sticky top-0 z-30 border-b border-outline bg-surface/85 px-5 py-3 backdrop-blur">
	<div class="mx-auto grid max-w-[1280px] grid-cols-[minmax(0,1fr)_auto] items-center gap-4">
		<label class="relative min-w-0 max-w-[44rem]">
			<i class="pi pi-search absolute left-4 top-1/2 -translate-y-1/2 text-lg text-on-surface-muted"></i>
			<input
				type="search"
				class="h-11 w-full rounded-pill border border-outline bg-surface-container pl-12 pr-16 text-body-sm font-medium text-on-surface outline-none placeholder:text-on-surface-muted transition-colors duration-fast ease-standard focus:bg-surface-container-high focus:shadow-[0_0_0_2px_rgb(var(--rgb-primary)/0.35)]"
				placeholder="Buscar recetas, ingredientes o usuarios..."
			/>
			<span class="absolute right-4 top-1/2 hidden -translate-y-1/2 rounded-sm border border-outline bg-surface px-1.5 py-0.5 text-[0.65rem] font-bold text-on-surface-muted sm:inline">⌘K</span>
		</label>

		<div class="flex items-center gap-2">
			<button type="button" class="inline-flex h-11 items-center gap-2 rounded-pill bg-primary px-5 text-body-sm font-bold text-on-primary shadow-1 transition-all duration-fast ease-standard hover:shadow-2 active:scale-95">
				<i class="pi pi-plus"></i>
				<span class="hidden sm:inline">Crear</span>
			</button>
			<a routerLink="/notifications" class="relative hidden size-10 place-items-center rounded-pill text-on-surface transition-colors duration-fast ease-standard hover:bg-surface-container sm:grid" aria-label="Notificaciones">
				<i class="pi pi-bell text-xl"></i>
			</a>
			<a routerLink="/profile" class="flex items-center gap-2 rounded-pill focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary">
				<span class="grid size-10 overflow-hidden rounded-pill bg-primary">
					<img
						[src]="profile()?.photo_url || logoUrl"
						[alt]="profile()?.username || 'Perfil'"
						class="size-full"
						[class.object-cover]="profile()?.photo_url"
						[class.object-contain]="!profile()?.photo_url"
					/>
				</span>
				<i class="pi pi-chevron-down hidden text-sm text-on-surface-muted sm:inline"></i>
			</a>
		</div>
	</div>
</header>
