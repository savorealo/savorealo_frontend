<header class="sticky top-0 z-30 border-b border-black/10 bg-white/95 px-5 py-5 backdrop-blur-xl">
	<div class="mx-auto grid max-w-[1280px] grid-cols-[minmax(0,1fr)_auto] items-center gap-5">
		<label class="relative min-w-0 max-w-[46rem]">
			<i class="pi pi-search absolute left-5 top-1/2 -translate-y-1/2 text-xl text-black/30"></i>
			<input
				type="search"
				class="h-12 w-full rounded-full border-0 bg-black/[0.04] pl-14 pr-16 text-sm font-semibold text-black outline-none placeholder:text-black/35 focus:bg-white focus:shadow-[0_0_0_2px_rgba(255,139,37,0.22)]"
				placeholder="Buscar recetas, ingredientes o usuarios..."
			/>
			<span class="absolute right-5 top-1/2 hidden -translate-y-1/2 rounded-md bg-black/5 px-2 py-1 text-xs font-semibold text-black/45 sm:inline">⌘ K</span>
		</label>

		<div class="flex items-center gap-3">
			<button type="button" class="inline-flex h-12 items-center gap-2 rounded-full bg-gradient-to-r from-orange-500 to-orange-600 px-6 text-base font-black text-white shadow-sm">
				<i class="pi pi-plus"></i>
				<span class="hidden sm:inline">Crear</span>
			</button>
			<button type="button" class="hidden h-12 items-center gap-2 rounded-full border border-black/10 px-5 text-base font-black text-black shadow-sm md:inline-flex">
				<span>✨</span>
				<span>IA Recetas</span>
			</button>
			<button type="button" class="relative hidden size-12 place-items-center rounded-full border border-black/10 text-black shadow-sm sm:grid" aria-label="Notificaciones">
				<i class="pi pi-bell text-xl"></i>
				<span class="absolute right-1 top-1 grid size-5 place-items-center rounded-full bg-orange-600 text-[0.7rem] font-black text-white">3</span>
			</button>
			<button type="button" class="relative hidden size-12 place-items-center rounded-full border border-black/10 text-black shadow-sm sm:grid" aria-label="Mensajes">
				<i class="pi pi-comment text-xl"></i>
				<span class="absolute right-1 top-1 grid size-5 place-items-center rounded-full bg-orange-600 text-[0.7rem] font-black text-white">2</span>
			</button>
			<a routerLink="/profile" class="flex items-center gap-2 rounded-full focus:outline-none focus:ring-2 focus:ring-orange-400">
				<span class="grid size-12 overflow-hidden rounded-full bg-orange-500">
					<img
						[src]="profile()?.photo_url || logoUrl"
						[alt]="profile()?.username || 'Perfil'"
						class="size-full"
						[class.object-cover]="profile()?.photo_url"
						[class.object-contain]="!profile()?.photo_url"
					/>
				</span>
				<i class="pi pi-chevron-down hidden text-sm text-black/45 sm:inline"></i>
			</a>
		</div>
	</div>
</header>
