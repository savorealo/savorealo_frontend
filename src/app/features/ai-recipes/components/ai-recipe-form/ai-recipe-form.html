<section class="rounded-3xl bg-gradient-to-br from-[#f24d55] via-[#ff8841] to-[#ffd557] p-8 text-white shadow-[0_24px_60px_rgba(255,116,45,0.24)]">
	<label class="grid gap-4">
		<span class="text-lg font-black">Cuentanos que tienes en casa <i class="pi pi-info-circle text-white/70"></i></span>
		<div class="relative">
			<textarea
				pTextarea
				rows="4"
				maxlength="120"
				[ngModel]="store.ingredientsText()"
				(ngModelChange)="updateIngredients($event)"
				class="min-h-32 w-full resize-none rounded-2xl border-0 bg-white p-6 pr-16 text-lg font-semibold leading-7 text-black outline-none placeholder:text-black/30"
				placeholder="Ej: pollo, arroz, brocoli, limon..."
			></textarea>
			<span class="absolute bottom-5 right-6 text-sm font-bold text-black/30">{{ store.ingredientsText().length }}/120</span>
		</div>
	</label>

	<div class="mt-8 grid gap-4">
		<h2 class="text-lg font-black">O elige algunas sugerencias:</h2>
		<div class="flex flex-wrap gap-3">
			@for (suggestion of store.suggestions; track suggestion) {
				<button
					type="button"
					class="rounded-2xl border border-white/45 px-5 py-3 text-base font-black text-white transition hover:bg-white/15"
					[class.bg-white]="store.selectedSuggestions().includes(suggestion)"
					[class.text-orange-600]="store.selectedSuggestions().includes(suggestion)"
					(click)="store.toggleSuggestion(suggestion)"
				>
					{{ suggestion }}
				</button>
			}
		</div>
	</div>

	<div class="mt-8 grid gap-4">
		<h2 class="text-lg font-black">¿Que tipo de receta buscas?</h2>
		<div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
			@for (option of recipeTypes; track option.type) {
				<button
					type="button"
					class="relative flex min-h-24 items-center gap-4 rounded-2xl bg-white p-5 text-left text-black shadow-sm transition hover:scale-[1.01]"
					[class.ring-4]="store.selectedRecipeType() === option.type"
					[class.ring-white]="store.selectedRecipeType() === option.type"
					(click)="store.setRecipeType(option.type)"
				>
					<i [class]="option.icon" class="text-3xl text-orange-500"></i>
					<span>
						<strong class="block text-base font-black">{{ option.title }}</strong>
						<span class="text-sm font-semibold text-black/45">{{ option.description }}</span>
					</span>
					@if (store.selectedRecipeType() === option.type) {
						<span class="absolute right-4 top-4 grid size-6 place-items-center rounded-full bg-orange-500 text-xs text-white">
							<i class="pi pi-check"></i>
						</span>
					}
				</button>
			}
		</div>
	</div>

	<div class="mt-8 grid gap-4">
		<h2 class="text-lg font-black">Numero de porciones</h2>
		<div class="flex items-center gap-6">
			<button type="button" class="grid size-14 place-items-center rounded-full bg-white/20 text-2xl font-black" (click)="store.decrementPortions()">−</button>
			<span class="text-xl font-black">{{ store.portions() }} porciones</span>
			<button type="button" class="grid size-14 place-items-center rounded-full bg-white/20 text-2xl font-black" (click)="store.incrementPortions()">+</button>
		</div>
	</div>

	@if (store.error()) {
		<p class="mt-6 rounded-2xl bg-white/20 p-4 text-sm font-bold">{{ store.error() }}</p>
	}

	<button
		type="button"
		class="mt-8 flex h-20 w-full items-center justify-center gap-3 rounded-2xl bg-white text-2xl font-black text-orange-600 shadow-sm transition hover:scale-[1.01] disabled:cursor-not-allowed disabled:opacity-60"
		[disabled]="!store.canGenerate()"
		(click)="store.generate()"
	>
		<span>✨</span>
		<span>{{ store.loading() ? 'Creando receta...' : 'Generar receta' }}</span>
	</button>
</section>
