<section class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_32rem]">
	<div class="grid content-center">
		<h1 class="flex items-center gap-3 text-4xl font-black tracking-tight text-black lg:text-5xl">
			<span>✨</span>
			<span>IA Recetas</span>
		</h1>
		<p class="mt-6 max-w-xl text-xl font-semibold leading-9 text-black/70">
			Cuentanos que tienes o que se te antoja y nuestra IA creara la receta perfecta para ti.
		</p>
	</div>

	<div class="hidden items-center justify-center gap-5 lg:flex">
		<img [src]="logoUrl" alt="" class="size-40 object-contain drop-shadow-[0_12px_30px_rgba(255,110,32,0.25)]" />
		<div class="relative rounded-2xl border border-orange-100 bg-white p-6 shadow-sm">
			<div class="absolute -left-5 top-1/2 size-10 -translate-y-1/2 rotate-45 border-b border-l border-orange-100 bg-white"></div>
			<div class="relative">
				<h2 class="text-xl font-black text-black">¡Hola, {{ profile()?.fullName || profile()?.username || 'Maria' }}! 👋</h2>
				<p class="mt-3 max-w-xs text-base font-semibold leading-7 text-black/65">
					Estoy listo para crear una receta deliciosa especialmente para ti.
				</p>
			</div>
		</div>
	</div>
</section>
