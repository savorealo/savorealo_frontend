<div class="flex items-start justify-between gap-4 pb-1">
	<div>
		<h1 class="flex items-center gap-2 font-display text-headline-sm text-on-surface sm:text-headline-md">
			<i class="pi pi-sparkles text-primary"></i>
			<span>{{ 'ai.title' | translate }}</span>
		</h1>
		<p class="mt-1 text-body-sm font-medium text-on-surface-muted">
			{{ 'ai.hero_subtitle' | translate }}
		</p>
	</div>
	@if (profile(); as p) {
		<span class="hidden shrink-0 text-body-sm font-semibold text-on-surface-muted sm:block">
			{{ 'ai.hero_hello' | translate }}{{ p.fullName || p.username }}
		</span>
	}
</div>
