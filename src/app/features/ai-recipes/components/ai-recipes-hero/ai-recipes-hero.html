<section class="relative grid items-center gap-5 overflow-hidden rounded-2xl border border-outline p-4 sm:p-6 lg:grid-cols-[minmax(0,1fr)_auto] lg:p-8"
	style="background: var(--gradient-dark-ui)">
	<!-- Glow radial sobre el gradiente -->
	<div class="pointer-events-none absolute inset-0" style="background: var(--gradient-warm-glow)"></div>
	<div class="relative min-w-0">
		<h1 class="flex items-center gap-3 font-display text-headline-lg text-white sm:text-display-sm lg:text-display-md">
			<i class="pi pi-sparkles text-[#FFB347]"></i>
			<span>IA Recetas</span>
		</h1>
		<p class="mt-3 max-w-xl text-body-md font-medium leading-snug text-white/60 sm:mt-4 sm:text-body-lg">
			Cuéntanos qué tienes o qué se te antoja y nuestra IA creará la receta perfecta para ti.
		</p>
	</div>

	<div class="hidden items-center gap-4 lg:flex">
		<img
			[src]="logoUrl"
			alt=""
			class="size-28 object-contain drop-shadow-3"
		/>
		<div class="relative rounded-2xl border border-outline bg-surface p-5 shadow-1 max-w-xs">
			<div class="absolute -left-2 top-1/2 size-4 -translate-y-1/2 rotate-45 border-b border-l border-outline bg-surface"></div>
			<div class="relative">
				<h2 class="text-title-md font-bold text-on-surface">Hola, {{ profile()?.fullName || profile()?.username || 'chef' }}</h2>
				<p class="mt-2 text-body-sm font-medium leading-snug text-on-surface-muted">
					Estoy listo para crear una receta deliciosa especialmente para ti.
				</p>
			</div>
		</div>
	</div>
</section>
