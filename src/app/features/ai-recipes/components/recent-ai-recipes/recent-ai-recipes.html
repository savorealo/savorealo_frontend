<section class="rounded-3xl border border-black/5 bg-white p-6 shadow-sm">
	<h2 class="mb-6 text-2xl font-black text-black">Recetas generadas recientemente</h2>

	<div class="grid gap-5">
		@for (recipe of store.recentRecipes; track recipe.id) {
			<article class="grid grid-cols-[76px_1fr_auto] items-center gap-4">
				<img [src]="recipe.imageUrl" alt="" class="h-16 w-20 rounded-xl object-cover" />
				<div class="min-w-0">
					<h3 class="truncate text-base font-black text-black">{{ recipe.title }}</h3>
					<p class="truncate text-sm font-semibold text-black/45">{{ recipe.createdLabel }}</p>
				</div>
				<button type="button" class="grid size-10 place-items-center rounded-full text-black/70 hover:bg-black/5" aria-label="Guardar receta">
					<i class="pi pi-bookmark text-xl"></i>
				</button>
			</article>
		}
	</div>
</section>
