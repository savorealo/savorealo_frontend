<section class="rounded-2xl border border-outline bg-surface-container p-5 shadow-1">
	<header class="mb-5 flex items-center justify-between">
		<h2 class="flex items-center gap-2 text-title-md font-bold text-on-surface">
			<i class="pi pi-lightbulb text-secondary"></i>
			<span>Ideas para ti</span>
		</h2>
		<button type="button" class="inline-flex items-center gap-1 text-body-sm font-bold text-primary hover:underline" (click)="store.refreshIdeas()">
			<i class="pi pi-refresh"></i>
			<span>Actualizar</span>
		</button>
	</header>

	<div class="grid gap-4">
		@for (idea of store.ideas(); track idea.id) {
			<article class="grid grid-cols-[48px_1fr_auto] items-center gap-3">
				<img [src]="idea.imageUrl" alt="" class="size-12 rounded-pill object-cover" />
				<div class="min-w-0">
					<h3 class="truncate text-body-md font-bold text-on-surface">{{ idea.title }}</h3>
					<p class="truncate text-body-sm font-medium text-on-surface-muted">{{ idea.description }}</p>
				</div>
				<button type="button" class="min-h-11 rounded-pill bg-primary-container px-4 text-body-sm font-bold text-on-primary-container transition-all duration-fast ease-standard hover:shadow-1">
					Ver
				</button>
			</article>
		}
	</div>
</section>
