<app-shell>
	<div class="min-h-dvh bg-surface text-on-surface">
		<section class="mx-auto grid max-w-[1280px] gap-5 px-3 py-4 sm:gap-8 sm:px-6 sm:py-8 lg:grid-cols-[minmax(0,1fr)_22rem] lg:py-10">
			<main class="grid min-w-0 gap-5 sm:gap-8">
				<app-ai-recipes-hero />
				<app-ai-recipe-form />
				<app-ai-recipe-result [recipe]="store.generatedRecipe()" />
			</main>

			<aside class="grid min-w-0 content-start gap-5 sm:gap-6">
				<app-ai-ideas-panel />
				<app-recent-ai-recipes />
			</aside>
		</section>
	</div>
</app-shell>
