<app-shell>
	<div class="min-h-dvh bg-white text-black">
		<app-ai-recipes-topbar />

		<section class="mx-auto grid max-w-[1280px] gap-8 px-6 py-10 lg:grid-cols-[minmax(0,1fr)_30rem]">
			<main class="grid gap-8">
				<app-ai-recipes-hero />
				<app-ai-recipe-form />
				<app-ai-recipe-result [recipe]="store.generatedRecipe()" />
			</main>

			<aside class="grid content-start gap-6">
				<app-ai-ideas-panel />
				<app-recent-ai-recipes />
			</aside>
		</section>
	</div>
</app-shell>
