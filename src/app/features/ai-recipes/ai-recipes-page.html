<app-shell>
	<div class="min-h-dvh bg-gradient-to-b from-surface via-surface to-surface-container text-on-surface">
		<section class="mx-auto grid max-w-[1280px] gap-4 px-3 py-6 sm:gap-6 sm:px-6 sm:py-8 lg:grid-cols-[minmax(0,1fr)_24rem] lg:gap-8 lg:py-10">
			<main class="grid min-w-0 gap-4 sm:gap-6">
				<app-ai-recipes-hero />
				<app-ai-recipe-form />
				<app-ai-recipe-result [recipe]="store.generatedRecipe()" />
			</main>

			<aside class="hidden min-w-0 content-start gap-6 lg:grid">
				<app-ai-ideas-panel />
				<app-recent-ai-recipes />
			</aside>
		</section>

		<section class="mx-auto grid max-w-[1280px] gap-4 px-3 py-4 sm:gap-6 sm:px-6 sm:py-6 lg:hidden">
			<app-ai-ideas-panel />
			<app-recent-ai-recipes />
		</section>
	</div>
</app-shell>
