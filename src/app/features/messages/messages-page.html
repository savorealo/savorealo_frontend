<app-shell>
	<!-- Global overlays -->
	<app-incoming-call />
	<app-call-overlay />
	@if (showCompose()) {
		<app-new-conversation (close)="showCompose.set(false)" />
	}

	<div class="flex h-dvh min-h-0 flex-col overflow-hidden bg-[#f6f6f6]">
		<app-messages-topbar class="shrink-0" (newConversation)="showCompose.set(true)" />

		<main class="mx-auto grid min-h-0 w-full max-w-[1480px] flex-1 gap-5 overflow-hidden px-4 py-5 lg:grid-cols-[430px_minmax(0,1fr)] lg:px-5">

			@if (store.loadingConversations()) {
				<div class="flex min-h-0 flex-col rounded-[1.75rem] border border-black/5 bg-white shadow-[0_18px_60px_rgba(20,20,20,0.08)]">
					<div class="border-b border-black/5 p-6">
						<div class="h-8 w-40 animate-pulse rounded-full bg-surface-100"></div>
						<div class="mt-6 h-12 animate-pulse rounded-full bg-surface-100"></div>
					</div>
					<div class="grid gap-3 p-4">
						@for (item of [1, 2, 3, 4, 5]; track item) {
							<div class="flex gap-3 rounded-3xl p-3">
								<div class="size-14 shrink-0 animate-pulse rounded-full bg-surface-100"></div>
								<div class="flex-1 grid gap-2 py-1">
									<div class="h-4 w-3/4 animate-pulse rounded-full bg-surface-100"></div>
									<div class="h-3 w-1/2 animate-pulse rounded-full bg-surface-100"></div>
								</div>
							</div>
						}
					</div>
				</div>
			} @else {
				<app-conversation-list
					class="min-h-0"
					[conversations]="store.conversations()"
					[activeId]="store.activeId() ?? ''"
					(selectConversation)="store.selectConversation($event)"
					(compose)="showCompose.set(true)"
				/>
			}

			@if (store.activeConversation(); as conversation) {
				<app-chat-panel
					class="min-h-0"
					[conversation]="conversation"
					[messages]="store.messages()"
					[loading]="store.loadingMessages()"
					[isTyping]="store.isTyping()"
					(sendMessage)="store.sendMessage($event)"
					(typing)="store.onTyping()"
					(startCall)="onStartCall($event)"
				/>
			} @else if (!store.loadingConversations()) {
				<div class="hidden min-h-0 place-items-center rounded-[1.75rem] border border-black/5 bg-white lg:grid">
					<div class="text-center">
						<i class="pi pi-comments text-5xl text-orange-200"></i>
						<p class="mt-4 text-lg font-black text-black/40">Selecciona una conversacion</p>
					</div>
				</div>
			}

		</main>
	</div>
</app-shell>
