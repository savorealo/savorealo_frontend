<app-shell>
	<!-- Global overlays -->
	<app-incoming-call />
	<app-call-overlay />
	@if (showCompose()) {
		<app-new-conversation (close)="showCompose.set(false)" />
	}

	<div class="flex h-full min-h-0 flex-col overflow-hidden bg-surface text-on-surface">
		<main class="mx-auto grid min-h-0 w-full max-w-[1480px] flex-1 gap-0 overflow-hidden px-0 py-0 lg:grid-cols-[430px_minmax(0,1fr)] lg:gap-5 lg:px-5 lg:py-5">

			@if (store.loadingConversations()) {
				<div class="flex min-h-0 flex-col bg-surface-container sm:rounded-2xl sm:border sm:border-outline sm:shadow-2"
					 [class.hidden]="store.activeConversation()"
					 [class.lg:flex]="true">
					<div class="border-b border-outline p-4 sm:p-6">
						<div class="h-6 w-32 animate-pulse rounded-pill bg-surface-container-high sm:h-8 sm:w-40"></div>
						<div class="mt-4 h-10 animate-pulse rounded-pill bg-surface-container-high sm:mt-6 sm:h-12"></div>
					</div>
					<div class="grid gap-3 p-3 sm:p-4">
						@for (item of [1, 2, 3, 4, 5]; track item) {
							<div class="flex gap-3 rounded-2xl p-3">
								<div class="size-12 shrink-0 animate-pulse rounded-pill bg-surface-container-high sm:size-14"></div>
								<div class="flex-1 grid gap-2 py-1">
									<div class="h-4 w-3/4 animate-pulse rounded-pill bg-surface-container-high"></div>
									<div class="h-3 w-1/2 animate-pulse rounded-pill bg-surface-container-high"></div>
								</div>
							</div>
						}
					</div>
				</div>
			} @else {
				<app-conversation-list
					class="min-h-0"
					[class.hidden]="store.activeConversation()"
					[class.lg:block]="true"
					[conversations]="store.conversations()"
					[activeId]="store.activeId() ?? ''"
					(selectConversation)="store.selectConversation($event)"
					(compose)="showCompose.set(true)"
				/>
			}

			@if (store.activeConversation(); as conversation) {
				<app-chat-panel
					class="min-h-0"
					[conversation]="conversation"
					[messages]="store.messages()"
					[loading]="store.loadingMessages()"
					[isTyping]="store.isTyping()"
					(sendMessage)="store.sendMessage($event)"
					(typing)="store.onTyping()"
					(startCall)="onStartCall($event)"
					(back)="store.clearActive()"
				/>
			} @else if (!store.loadingConversations()) {
				<div class="hidden min-h-0 place-items-center rounded-2xl border border-outline bg-surface-container lg:grid">
					<div class="text-center">
						<i class="pi pi-comments text-5xl text-primary"></i>
						<p class="mt-4 text-title-md font-bold text-on-surface-muted">Selecciona una conversación</p>
					</div>
				</div>
			}

		</main>
	</div>
</app-shell>
