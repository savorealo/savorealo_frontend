@if (loading()) {
	<div class="mx-3 my-3 grid min-h-24 place-items-center rounded-2xl border border-outline bg-surface-container-low text-primary">
		<i class="pi pi-spin pi-spinner"></i>
	</div>
} @else if (failed()) {
	<div class="mx-3 my-3 rounded-2xl border border-outline bg-surface-container-low p-4">
		<p class="text-sm font-black text-on-surface">Perfil no disponible</p>
		<p class="mt-1 text-xs font-semibold text-on-surface-muted">No se pudo cargar este perfil.</p>
	</div>
} @else {
	<a
		[routerLink]="profileLink()"
		class="mx-3 my-3 flex min-w-0 items-center gap-3 rounded-2xl border border-outline bg-surface-container-low p-4 transition hover:border-primary/40 hover:bg-surface-container"
	>
		<app-avatar [src]="user()?.photo_url ?? null" [name]="displayName()" size="lg" />
		<div class="min-w-0 flex-1">
			<div class="flex items-center gap-2">
				<p class="truncate text-sm font-black text-on-surface">{{ displayName() }}</p>
				@if (isLocked()) {
					<i class="pi pi-lock shrink-0 text-xs text-on-surface-muted"></i>
				}
			</div>
			@if (handle()) {
				<p class="truncate text-xs font-semibold text-on-surface-muted">&#64;{{ handle() }}</p>
			}
			<p class="mt-1 text-xs font-bold text-primary">Ver perfil</p>
		</div>
		<i class="pi pi-chevron-right shrink-0 text-xs text-primary"></i>
	</a>
}
