@if (loading()) {
	<div class="mx-3 my-3 grid min-h-20 max-w-72 place-items-center rounded-2xl border border-outline bg-surface-container-low text-primary sm:max-w-80">
		<i class="pi pi-spin pi-spinner"></i>
	</div>
} @else if (locked()) {
	<div class="mx-3 my-3 max-w-72 overflow-hidden rounded-2xl border border-outline bg-surface-container-low sm:max-w-80">
		<div class="flex items-center gap-3 p-3">
			<span class="grid size-12 shrink-0 place-items-center rounded-2xl bg-surface-container text-on-surface-muted">
				<i class="pi pi-lock text-lg"></i>
			</span>
			<div class="min-w-0 flex-1">
				<p class="text-sm font-black text-on-surface">Post privado</p>
				<p class="line-clamp-2 text-xs font-semibold leading-5 text-on-surface-muted">
					Este post pertenece a {{ authorName() }}. Visita el perfil para solicitar acceso.
				</p>
			</div>
		</div>
		<a
			[routerLink]="profileLink()"
			class="flex items-center justify-between border-t border-outline px-3 py-2.5 text-sm font-black text-primary transition hover:bg-primary-container"
		>
			Ver perfil
			<i class="pi pi-chevron-right text-xs"></i>
		</a>
	</div>
} @else if (post() || preview()) {
	<a
		[routerLink]="postLink()"
		class="mx-3 my-3 grid max-w-72 overflow-hidden rounded-2xl border border-outline bg-surface-container-low transition hover:border-primary/40 hover:bg-surface-container sm:max-w-80"
	>
		@if (media(); as m) {
			<div class="aspect-[2.35/1] overflow-hidden bg-surface-container">
				@if (m.type === 'video') {
					<video [src]="m.url" class="size-full object-cover" preload="metadata"></video>
				} @else {
					<img [src]="m.url" [alt]="title()" class="size-full object-cover" />
				}
			</div>
		}
		<div class="p-3">
			<p class="line-clamp-2 text-sm font-black leading-5 text-on-surface">{{ title() }}</p>
			<p class="mt-1 truncate text-xs font-semibold text-on-surface-muted">Por {{ authorName() }}</p>
		</div>
	</a>
}
