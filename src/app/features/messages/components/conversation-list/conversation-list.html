<aside class="flex h-full min-h-0 flex-col rounded-[1.75rem] border border-black/5 bg-white shadow-[0_18px_60px_rgba(20,20,20,0.08)]">
	<div class="border-b border-black/5 p-5 sm:p-6">
		<div class="flex items-center justify-between gap-4">
			<h1 class="text-3xl font-black tracking-tight text-black">Mensajes</h1>
			<button
				type="button"
				class="grid size-11 place-items-center rounded-2xl border border-orange-200 bg-orange-50 text-orange-500 transition hover:bg-orange-500 hover:text-white"
				(click)="compose.emit()"
				aria-label="Nueva conversacion"
			>
				<i class="pi pi-pencil text-xl"></i>
			</button>
		</div>

		<label class="relative mt-6 block">
			<i class="pi pi-search absolute left-5 top-1/2 -translate-y-1/2 text-lg text-black/25"></i>
			<input
				type="search"
				class="h-13 w-full rounded-full border-0 bg-[#f1f1f1] pl-14 pr-4 text-sm font-semibold text-black outline-none placeholder:text-black/35 focus:bg-white focus:shadow-[0_0_0_2px_rgba(255,139,37,0.18)]"
				placeholder="Buscar conversaciones..."
				(input)="setQuery($event)"
			/>
		</label>

		<div class="mt-6 grid grid-cols-3 gap-3">
			<button
				type="button"
				class="h-11 rounded-full px-4 text-sm font-black transition"
				[ngClass]="filter() === 'all' ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/20' : 'bg-black/[0.04] text-black/65 hover:bg-orange-50 hover:text-orange-600'"
				(click)="setFilter('all')"
			>
				Todas
			</button>
			<button
				type="button"
				class="relative h-11 rounded-full px-4 text-sm font-black transition"
				[ngClass]="filter() === 'unread' ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/20' : 'bg-black/[0.04] text-black/65 hover:bg-orange-50 hover:text-orange-600'"
				(click)="setFilter('unread')"
			>
				No leidas
				@if (unreadTotal() > 0) {
					<span class="ml-2 inline-grid size-5 place-items-center rounded-full bg-red-500 text-[0.7rem] text-white">{{ unreadTotal() }}</span>
				}
			</button>
			<button
				type="button"
				class="h-11 rounded-full px-4 text-sm font-black transition"
				[ngClass]="filter() === 'groups' ? 'bg-orange-500 text-white shadow-lg shadow-orange-500/20' : 'bg-black/[0.04] text-black/65 hover:bg-orange-50 hover:text-orange-600'"
				(click)="setFilter('groups')"
			>
				Grupos
			</button>
		</div>
	</div>

	<div class="min-h-0 flex-1 overflow-y-auto p-3">
		@for (conversation of filteredConversations(); track conversation.id) {
			<button
				type="button"
				class="group grid w-full grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-3 rounded-3xl p-3 text-left transition"
				[ngClass]="conversation.id === activeId() ? 'bg-black/[0.04] shadow-sm' : 'hover:bg-orange-50'"
				(click)="selectConversation.emit(conversation.id)"
			>
				<span class="relative grid size-14 shrink-0 place-items-center overflow-hidden rounded-full bg-orange-100">
					<img [src]="conversation.user.avatarUrl" [alt]="conversation.user.name" class="size-full object-cover" />
					@if (conversation.user.online) {
						<span class="absolute bottom-0.5 right-0.5 size-3.5 rounded-full border-2 border-white bg-green-500"></span>
					}
				</span>

				<span class="min-w-0">
					<span class="flex min-w-0 items-center gap-1">
						<span class="truncate text-sm font-black text-black">{{ conversation.user.name }}</span>
						@if (conversation.user.verified) {
							<i class="pi pi-verified text-xs text-blue-500"></i>
						}
					</span>
					<span class="mt-1 block truncate text-sm font-semibold text-black/45">{{ conversation.lastMessage }}</span>
				</span>

				<span class="grid justify-items-end gap-2">
					<span class="text-xs font-black text-black/35">{{ conversation.time }}</span>
					@if (conversation.unread > 0) {
						<span class="grid size-6 place-items-center rounded-full bg-orange-500 text-xs font-black text-white">{{ conversation.unread }}</span>
					}
				</span>
			</button>
		} @empty {
			<div class="grid min-h-40 place-items-center rounded-3xl bg-[#fafafa] p-6 text-center">
				<div>
					<i class="pi pi-comments text-3xl text-orange-500"></i>
					<p class="mt-3 text-sm font-black text-black">No hay conversaciones</p>
					<p class="mt-1 text-xs font-semibold text-black/45">Prueba con otra busqueda.</p>
				</div>
			</div>
		}
	</div>
</aside>
