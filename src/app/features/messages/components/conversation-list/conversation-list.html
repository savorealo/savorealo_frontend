<aside class="flex h-full min-h-0 flex-col rounded-2xl border border-outline bg-surface-container shadow-4">
	<div class="border-b border-outline p-5 sm:p-6">
		<div class="flex items-center justify-between gap-4">
			<h1 class="text-headline-lg font-black text-on-surface">Mensajes</h1>
			<button
				type="button"
				class="grid size-11 place-items-center rounded-2xl border border-outline bg-primary-container text-on-primary-container transition duration-fast ease-standard hover:border-primary hover:bg-primary hover:text-on-primary active:scale-[0.98]"
				(click)="compose.emit()"
				aria-label="Nueva conversacion"
			>
				<i class="pi pi-pencil text-xl"></i>
			</button>
		</div>

		<label class="relative mt-6 block">
			<i class="pi pi-search absolute left-5 top-1/2 -translate-y-1/2 text-lg text-on-surface-muted"></i>
			<input
				type="search"
				class="h-12 w-full rounded-pill border border-transparent bg-surface-container-low pl-14 pr-4 text-sm font-semibold text-on-surface outline-none placeholder:text-on-surface-muted focus:border-primary focus:bg-surface-container focus:shadow-[0_0_0_3px_rgb(var(--rgb-primary)/0.16)]"
				placeholder="Buscar conversaciones..."
				(input)="setQuery($event)"
			/>
		</label>

		<div class="mt-6 grid grid-cols-3 gap-3">
			<button
				type="button"
				class="h-11 rounded-pill px-4 text-sm font-black transition duration-fast ease-standard"
				[ngClass]="filter() === 'all' ? 'bg-primary text-on-primary shadow-2' : 'bg-surface-container-low text-on-surface-muted hover:bg-primary-container hover:text-on-primary-container'"
				(click)="setFilter('all')"
			>
				Todas
			</button>
			<button
				type="button"
				class="relative h-11 rounded-pill px-4 text-sm font-black transition duration-fast ease-standard"
				[ngClass]="filter() === 'unread' ? 'bg-primary text-on-primary shadow-2' : 'bg-surface-container-low text-on-surface-muted hover:bg-primary-container hover:text-on-primary-container'"
				(click)="setFilter('unread')"
			>
				No leidas
				@if (unreadTotal() > 0) {
					<span class="ml-2 inline-grid size-5 place-items-center rounded-pill bg-error text-[0.7rem] text-on-error">{{ unreadTotal() }}</span>
				}
			</button>
			<button
				type="button"
				class="h-11 rounded-pill px-4 text-sm font-black transition duration-fast ease-standard"
				[ngClass]="filter() === 'groups' ? 'bg-primary text-on-primary shadow-2' : 'bg-surface-container-low text-on-surface-muted hover:bg-primary-container hover:text-on-primary-container'"
				(click)="setFilter('groups')"
			>
				Grupos
			</button>
		</div>
	</div>

	<div class="min-h-0 flex-1 overflow-y-auto p-3">
		@for (conversation of filteredConversations(); track conversation.id) {
			<button
				type="button"
				class="group grid w-full grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-3 rounded-2xl border border-transparent p-3 text-left transition duration-fast ease-standard"
				[ngClass]="conversation.id === activeId() ? 'border-primary/20 bg-primary-container/70 shadow-1' : 'hover:bg-surface-container-low'"
				(click)="selectConversation.emit(conversation.id)"
			>
				<span class="relative grid size-14 shrink-0 place-items-center overflow-hidden rounded-full bg-orange-100">
					<img [src]="avatarUrl(conversation)" [alt]="conversation.user.name" class="size-full object-cover" />
					@if (conversation.user.online) {
						<span class="absolute bottom-0.5 right-0.5 size-3.5 rounded-full border-2 border-surface-container bg-green-500"></span>
					}
				</span>

				<span class="min-w-0">
					<span class="flex min-w-0 items-center gap-1">
						<span class="truncate text-sm font-black text-on-surface">{{ conversation.user.name }}</span>
						@if (conversation.user.verified) {
							<i class="pi pi-verified text-xs text-blue-500"></i>
						}
					</span>
					@if (conversation.typing) {
						<span class="mt-1 flex items-center gap-1.5 truncate text-sm font-black text-primary">
							<span class="size-1.5 rounded-pill bg-primary"></span>
							escribiendo...
						</span>
					} @else if (conversation.lastMessageKind === 'post') {
						<span class="mt-1 inline-flex max-w-full items-center gap-1.5 rounded-pill bg-primary-container px-2.5 py-1 text-xs font-black text-on-primary-container">
							<i class="pi pi-images text-[0.7rem]"></i>
							<span class="truncate">{{ conversation.lastMessage }}</span>
						</span>
					} @else if (conversation.lastMessageKind === 'profile') {
						<span class="mt-1 inline-flex max-w-full items-center gap-1.5 rounded-pill bg-primary-container px-2.5 py-1 text-xs font-black text-on-primary-container">
							<i class="pi pi-user text-[0.7rem]"></i>
							<span class="truncate">{{ conversation.lastMessage }}</span>
						</span>
					} @else {
						<span class="mt-1 block truncate text-sm font-semibold text-on-surface-muted">{{ conversation.lastMessage }}</span>
					}
				</span>

				<span class="grid justify-items-end gap-2">
					<span class="text-xs font-black text-on-surface-muted">{{ conversation.time }}</span>
					@if (conversation.unread > 0) {
						<span class="grid size-6 place-items-center rounded-pill bg-primary text-xs font-black text-on-primary">{{ conversation.unread }}</span>
					}
				</span>
			</button>
		} @empty {
			<div class="grid min-h-40 place-items-center rounded-2xl bg-surface-container-low p-6 text-center">
				<div>
					<i class="pi pi-comments text-3xl text-primary"></i>
					<p class="mt-3 text-sm font-black text-on-surface">No hay conversaciones</p>
					<p class="mt-1 text-xs font-semibold text-on-surface-muted">Prueba con otra busqueda.</p>
				</div>
			</div>
		}
	</div>
</aside>
