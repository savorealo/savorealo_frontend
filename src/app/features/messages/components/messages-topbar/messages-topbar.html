<!-- Only shown on mobile — desktop already has the sidebar + conversation list heading -->
<header class="z-30 border-b border-black/10 bg-white/95 px-4 py-3 backdrop-blur lg:hidden">
	<div class="flex items-center justify-between gap-3">
		<!-- Left: logo + title -->
		<div class="flex items-center gap-3">
			<a routerLink="/" aria-label="Inicio">
				<img src="/assets/icons/new_logo.png" alt="Cookeealo" class="h-8 w-auto" />
			</a>
			<h1 class="text-xl font-black text-black">Mensajes</h1>
		</div>

		<!-- Right: compose + avatar -->
		<div class="flex items-center gap-2">
			<button
				type="button"
				class="grid size-10 place-items-center rounded-full border border-orange-200 bg-orange-50 text-orange-500 transition hover:bg-orange-500 hover:text-white active:scale-95"
				(click)="newConversation.emit()"
				aria-label="Nueva conversación"
			>
				<i class="pi pi-pencil"></i>
			</button>

			<a routerLink="/profile" class="grid size-10 shrink-0 place-items-center overflow-hidden rounded-full border border-[#ff8f27] bg-[#ff8f27]">
				<img
					[src]="profile()?.photo_url || '/assets/icons/new_logo.png'"
					[alt]="profile()?.username || 'Perfil'"
					class="size-full object-cover"
				/>
			</a>
		</div>
	</div>
</header>
