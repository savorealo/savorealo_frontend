name: Deploy to Staging

on:
  push:
    branches:
      - develop

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate environment file
        run: |
          cat > src/environments/environment.ts << EOF
          export const environment = {
            production: true,
            supabaseUrl: '${{ secrets.SUPABASE_URL }}',
            supabaseKey: '${{ secrets.SUPABASE_ANON_KEY }}',
            apiUrl: 'https://develop.app.savorealo.com/api',
          }
          EOF

      - name: Build (Cloudflare SSR)
        run: npm run build:cloudflare

      - name: Bundle SSR worker
        run: |
          echo "=== Server dir ==="
          ls -la dist/cookeealo/server/
          echo "=== Bundling ==="
          node_modules/.bin/esbuild dist/cookeealo/server/server.mjs \
            --bundle \
            --outfile=dist/cookeealo/browser/_worker.js \
            --format=esm \
            --platform=neutral \
            '--define:import.meta.url="file:///worker"' \
            --external:node:* \
            --log-level=info
          echo "=== Output ==="
          ls -lh dist/cookeealo/browser/_worker.js

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist/cookeealo/browser --project-name savorealo-frontend-staging --no-bundle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
